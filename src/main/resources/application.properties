spring.application.name=cool-art-social-media-server

# Port Server
server.port=3001

# Connection of PostgreSQL DB
spring.datasource.url=jdbc:postgresql://localhost:5432/socialmedia
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# optional: if DB connection gets lost
spring.datasource.driver-class-name=org.postgresql.Driver

# showing SQL query run by JdbcTemplate
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# Showing parameter inside ? in SQL query
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
